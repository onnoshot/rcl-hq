<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Capsule - Istatistik</title>
<style>
:root{--bg:#05060f;--card:#0c0f20;--bd:rgba(120,140,255,.18);--ink:#eef0ff;--mut:#8e92b8;--cy:#00f0ff;--mg:#ff2d9b;--li:#c6ff3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background:radial-gradient(60% 40% at 50% 0%,rgba(0,240,255,.1),transparent 60%),radial-gradient(40% 30% at 90% 10%,rgba(255,45,155,.1),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 18px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin:2px 0 18px}
.key{display:flex;gap:8px;margin-bottom:18px;max-width:460px}
.key input{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--ink);padding:11px 14px;font-size:14px;outline:none}
.btn{background:linear-gradient(90deg,var(--cy),var(--mg));color:#04050d;border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px}
.kpi .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.kpi .n.cy{color:var(--cy)}.kpi .n.mg{color:var(--mg)}.kpi .n.li{color:var(--li)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:700}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.bar .lbl{width:84px;color:var(--mut);flex:none}
.bar .track{flex:1;height:10px;background:#0b0d1c;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));border-radius:6px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.bar .val{width:42px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rate{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rate b{font-size:40px;font-weight:800;color:var(--li)}
.fb{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
.fb .stars{color:var(--li);flex:none}
.fb .who{color:var(--mut);font-size:11px}
.cam-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.cam-row img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#0b0d1c}
.cam-row .info{flex:1;min-width:0}.cam-row .info b{font-size:13px}.cam-row .info span{display:block;font-size:11px;color:var(--mut)}
.cam-row .sc{font-weight:800;color:var(--li);font-variant-numeric:tabular-nums}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-grid .p{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1}
.ph-grid img{width:100%;height:100%;object-fit:cover}
.ph-grid .lk{position:absolute;bottom:4px;left:4px;font-size:10px;font-weight:800;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 6px;color:var(--mg)}
.empty{color:var(--mut);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="wrap">
  <header><div><h1>Time Capsule &#183; Istatistik</h1><div class="sub">Topluluk + kullanici geri bildirim panosu</div></div>
    <button class="btn g" id="refresh">Yenile</button></header>
  <div class="key"><input id="apikey" type="password" placeholder="RCL_ALIM_KEY"><button class="btn" id="save">Kaydet</button></div>
  <div id="content"></div>
</div>
<script>
var BASE=localStorage.getItem('tcBase')||'https://rclhq.vercel.app/api/community';
var KEY=localStorage.getItem('rclAlimKey')||'';
var $=function(s){return document.querySelector(s)};
$('#apikey').value=KEY;
$('#save').onclick=function(){KEY=$('#apikey').value.trim();localStorage.setItem('rclAlimKey',KEY);load()};
$('#refresh').onclick=load;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function bar(lbl,val,max){var w=max?Math.round(val/max*100):0;return '<div class="bar"><span class="lbl">'+esc(lbl)+'</span><span class="track"><span class="fill" style="width:'+w+'%"></span></span><span class="val">'+val+'</span></div>'}
async function load(){
  if(!KEY){$('#content').innerHTML='<div class="empty">RCL_ALIM_KEY gir</div>';return}
  $('#content').innerHTML='<div class="empty">Yukleniyor...</div>';
  try{
    var r=await fetch(BASE+'/stats?key='+encodeURIComponent(KEY));var j=await r.json();
    if(!j.ok){$('#content').innerHTML='<div class="empty">Yetki hatasi - anahtari kontrol et</div>';return}
    var t=j.totals,f=j.feedback;
    var maxR=Math.max(1,...Object.values(f.byRating||{}));
    var cats=Object.entries(f.byCategory||{});var maxC=Math.max(1,...cats.map(function(c){return c[1]}));
    var maxBrand=Math.max(1,...(j.brands||[]).map(function(b){return b.votes}));
    $('#content').innerHTML=
      '<div class="kpis">'+
        '<div class="kpi"><div class="n cy">'+t.users+'</div><div class="l">Uye</div></div>'+
        '<div class="kpi"><div class="n">'+t.cameras+'</div><div class="l">Kamera</div></div>'+
        '<div class="kpi"><div class="n li">'+t.votes+'</div><div class="l">Oy</div></div>'+
        '<div class="kpi"><div class="n">'+t.photos+'</div><div class="l">Ani / Foto</div></div>'+
        '<div class="kpi"><div class="n mg">'+t.likes+'</div><div class="l">Begeni</div></div>'+
        '<div class="kpi"><div class="n">'+t.comments+'</div><div class="l">Yorum</div></div>'+
        '<div class="kpi"><div class="n cy">'+t.feedback+'</div><div class="l">Geri bildirim</div></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div class="panel"><h2>Geri bildirim puani</h2>'+
          '<div class="rate"><b>'+(f.avgRating||'-')+'</b><span style="color:var(--mut)">ortalama / 5 &#183; '+t.feedback+' yanit</span></div>'+
          [5,4,3,2,1].map(function(s){return bar(s+' yildiz',(f.byRating&&f.byRating[s])||0,maxR)}).join('')+'</div>'+
        '<div class="panel"><h2>Konu dagilimi</h2>'+
          (cats.length?cats.map(function(c){return bar(c[0],c[1],maxC)}).join(''):'<div class="empty">Henuz yok</div>')+'</div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div class="panel"><h2>En cok oylanan kameralar</h2>'+
          ((j.topCameras||[]).map(function(c){return '<div class="cam-row"><img src="'+esc(c.image_url)+'"><div class="info"><b>'+esc(c.model)+'</b><span>'+esc(c.brand)+' &#183; '+c.photo_count+' ani</span></div><span class="sc">'+c.score+'</span></div>'}).join('')||'<div class="empty">-</div>')+'</div>'+
        '<div class="panel"><h2>Markaya gore oy</h2>'+
          ((j.brands||[]).slice(0,8).map(function(b){return bar(b.brand,b.votes,maxBrand)}).join('')||'<div class="empty">-</div>')+'</div>'+
      '</div>'+
      '<div class="panel"><h2>En begenilen anilar</h2>'+
        '<div class="ph-grid">'+((j.topPhotos||[]).map(function(p){return '<div class="p"><img src="'+esc(p.image_url)+'"><span class="lk">&#9829; '+p.like_count+'</span></div>'}).join('')||'<div class="empty">-</div>')+'</div></div>'+
      '<div class="panel"><h2>Son geri bildirimler</h2>'+
        (f.recent&&f.recent.length?f.recent.map(function(x){return '<div class="fb"><span class="stars">'+('&#11088;'.repeat(x.rating||0)||'&#183;')+'</span><div><div>'+esc(x.message||'-')+'</div><div class="who">'+esc(x.author)+' &#183; '+esc(x.category||'')+'</div></div></div>'}).join(''):'<div class="empty">Henuz geri bildirim yok</div>')+'</div>';
  }catch(e){$('#content').innerHTML='<div class="empty">Baglanti hatasi</div>'}
}
load();
</script>
</body>
</html>
